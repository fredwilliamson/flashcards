name: Keep Backend Alive

on:
  schedule:
    # Runs every 14 minutes to prevent Render free tier cold start
    - cron: '*/14 * * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" ${{ secrets.BACKEND_URL }}/health || echo "000")
          if [ "$response" -eq "200" ]; then
            echo "✅ Backend is alive (HTTP $response)"
          else
            echo "⚠️ Backend returned HTTP $response"
          fi
        continue-on-error: true

      - name: Log timestamp
        run: echo "Last ping at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"


